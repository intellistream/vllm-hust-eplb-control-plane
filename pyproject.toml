[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-hust-eplb-control-plane"
dynamic = ["version"]
description = "Standalone vLLM general-plugin: lower CPU-side control-plane overhead of vLLM-Ascend-HUST's dynamic EPLB"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.entry-points."vllm.general_plugins"]
eplb_control_plane = "vllm_hust_eplb_control_plane.plugin:register"
eplb_wait_probe = "vllm_hust_eplb_control_plane.probe:register"

[project.entry-points."vllm_hust.extension_bundles"]
"org.vllm-hust.eplb-control-plane" = "vllm_hust_eplb_control_plane.manifests"

[tool.setuptools.dynamic]
version = {attr = "vllm_hust_eplb_control_plane._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vllm_hust_eplb_control_plane = ["manifests/*.json"]
